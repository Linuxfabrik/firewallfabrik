name: 'Linuxfabrik: Publish to PyPI'

on:
  release:
    types:
      - 'published'

permissions:
  contents: 'read'

jobs:
  build:
    name: 'Build package'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

      - name: 'Set up Python'
        uses: 'actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97' # v7.0.0
        with:
          python-version: '3.14'
          allow-prereleases: true

      - name: 'Install build tools'
        run: 'pip install --require-hashes --requirement .github/release/requirements.txt'

      # Without isolation, so the package is built by the hash-pinned setuptools
      # and the PySide6 whose pyside6-rcc compiles the Qt resource file, both
      # installed above, instead of by whatever an isolated build would fetch.
      - name: 'Build package'
        run: 'python -m build --no-isolation'

      - name: 'Upload build artifacts'
        uses: 'actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9' # v7.0.2
        with:
          name: 'dist'
          path: 'dist/'

  publish-testpypi:
    name: 'Publish to TestPyPI'
    needs: 'build'
    runs-on: 'ubuntu-latest'
    environment:
      name: 'testpypi'
      url: 'https://test.pypi.org/project/firewallfabrik/'
    permissions:
      id-token: 'write'
    steps:
      - name: 'Download build artifacts'
        uses: 'actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333' # v8.0.2
        with:
          name: 'dist'
          path: 'dist/'

      - name: 'Publish to TestPyPI'
        uses: 'pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086' # v1.14.3
        with:
          repository-url: 'https://test.pypi.org/legacy/'

  publish-pypi:
    name: 'Publish to PyPI'
    needs: 'publish-testpypi'
    runs-on: 'ubuntu-latest'
    environment:
      name: 'pypi'
      url: 'https://pypi.org/project/firewallfabrik/'
    permissions:
      id-token: 'write'
    steps:
      - name: 'Download build artifacts'
        uses: 'actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333' # v8.0.2
        with:
          name: 'dist'
          path: 'dist/'

      - name: 'Publish to PyPI'
        uses: 'pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086' # v1.14.3
